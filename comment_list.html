<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>テンプレート</title>
    <link href="../../_common/images/favicon.ico" rel="shortcut icon">
    <link href="https://fonts.googleapis.com/css?family=M+PLUS+1p:400,500" rel="stylesheet">
    <!-- <link href="../../_common/css/style.css" rel="stylesheet"> -->
    <style>
        .sidebar-comment {
            margin-bottom: 50px;
        }
        .comment-content {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: -10px 0 10px 0;
        }
        /* 編集中ーーーーーーーーーーーーー */
        .comment-box {
            position: relative;
            margin-bottom: auto;
            width: 100%;
        }
        /* ーーーーーーーーーーーーーーーーーーーーーー */
        .comment-area {
            border-color: #b0b0b070;
            border-radius: 3px;
            width: 100%;
            height: auto;
            
        }
        /* 編集中ーーーーーーーーーーーーー */
        .overlay-message {
            height: auto;
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 7%;
            background: rgba(0, 0, 0, 0.15);
            color: #6a6a6a;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 4px;
            z-index: 10;
            /* pointer-events: none; */
        }

        /* .comment-login {
            pointer-events: all;
        } */

        /* ーーーーーーーーーーーーーーーーーーーーーー */
        .comment-area:focus {
            border-color: red;
            outline: none;
        }
        .submit-button {
            width: 50%;
            margin: 0 auto;
            border: 1px solid #b0b0b050;
            border-radius: 3px;
            transition: color 0.25s, background-color 0.25s;
            cursor: pointer;
        }
        .submit-button:hover {
            color: white;
            background-color: red;
        }

        .comment-list {
            border-bottom: 1px solid #d3d3d3;
            margin-bottom: 10px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.05rem;
            color: #333;
        }
        .comment-list i {
            font-size: 1.2em;
        }
    </style>
</head>

<body>
    <header>
        <div class="container">
            <h1>タイトル</h1>
            <h2>サブタイトル</h2>
        </div><!-- /.container -->
    </header>
    <main>

        
        <div class="sidebar-comment">
					<h2><span>コメント&nbsp;<i class="fa-solid fa-comments" style="color: rgba(0, 0, 0, 0.6);" aria-hidden="true"></i></span></h2>
					<form class="comment-content" action="#" id="form">
						<div class="comment-box" id="commentBox">
							<textarea class="comment-area" type="text" id="commentArea" name="comment" rows="5" maxlength="500" 
							placeholder="コメントする..."></textarea>
							<!-- <div class="overlay-message" id="overlayMessage"><button class="comment-login" id="googleLoginBtnComment" style="width: 50%; background: red; color: white; border-style: none;">ログインする</button></div> -->
						</div>
						<button class="submit-button" id="commentSubmit">コメントする</button>
					</form>
                    
                    <div class="comment-list" style="border-bottom: 1px solid #d3d3d3;">コメント一覧
                        <i class="fa fa-thumbs-o-up" aria-hidden="true">いいね</i>
                    </div>
                </div>




        <div class="container">
            <section>
                <form action="#" id="form">
                    <input type="text" name="commentArea">
                    <input type="submit" value="コメントする">
                </form>
                <div id="output">
                </div>

                <!-- <p><span id="time"></span></p> -->
            </section>
        </div><!-- /.container -->
    </main>
    <footer>
        <div class="container">
            <p>JavaScript Samples</p>
        </div><!-- /.container -->
    </footer>
    <script type="module">
        import { db, collection, addDoc, serverTimestamp, query, orderBy, onSnapshot } from '/Users/soshi/BlogRam/blogram_vite/src/firebase/firestore.js';

        const form = document.getElementById('form');
        const commentArea = document.getElementById('commentArea');
        const output = document.getElementById('output');

        // コメント投稿処理
        form.onsubmit = async (event) => {
            event.preventDefault();
            const commentText = commentArea.value.trim();

            if (commentText === '') return;

            try {
                await addDoc(collection(db, 'comments'), {
                    text: commentText,
                    createdAt: serverTimestamp()
                });
                commentArea.value = '';
            } catch (e) {
                console.error("Error adding document: ", e);
            }
        };

        // Firestoreからコメントをリアルタイムで取得して表示
        const q = query(collection(db, 'comments'), orderBy('createdAt', 'desc'));
        onSnapshot(q, (querySnapshot) => {
            output.innerHTML = ''; // 表示を一度クリア
            querySnapshot.forEach((doc) => {
                const comment = doc.data();
                const commentList = document.createElement('div');
                commentList.className = 'comment-block';

                const commentTextElement = document.createElement('p');
                commentTextElement.textContent = comment.text;
                commentList.appendChild(commentTextElement);

                const commentDate = document.createElement('span');
                commentDate.className = 'comment-date';
                if (comment.createdAt) {
                    const d = comment.createdAt.toDate();
                    commentDate.textContent = `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${d.getMinutes()}`;
                }
                commentList.appendChild(commentDate);

                output.appendChild(commentList);
            });
        });
    </script>
</body>

</html>
