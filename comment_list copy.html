<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>テンプレート</title>
    <link href="../../_common/images/favicon.ico" rel="shortcut icon">
    <link href="https://fonts.googleapis.com/css?family=M+PLUS+1p:400,500" rel="stylesheet">
    <!-- <link href="../../_common/css/style.css" rel="stylesheet"> -->
    <style>
        .sidebar-comment {
            margin-bottom: 50px;
        }
        .comment-content {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: -10px 0 10px 0;
        }
        /* 編集中ーーーーーーーーーーーーー */
        .comment-box {
            position: relative;
            margin-bottom: auto;
            width: 100%;
        }
        /* ーーーーーーーーーーーーーーーーーーーーーー */
        .comment-area {
            border-color: #b0b0b070;
            border-radius: 3px;
            width: 100%;
            height: auto;
            
        }
        /* 編集中ーーーーーーーーーーーーー */
        .overlay-message {
            height: auto;
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 7%;
            background: rgba(0, 0, 0, 0.15);
            color: #6a6a6a;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 4px;
            z-index: 10;
            /* pointer-events: none; */
        }

        /* .comment-login {
            pointer-events: all;
        } */

        /* ーーーーーーーーーーーーーーーーーーーーーー */
        .comment-area:focus {
            border-color: red;
            outline: none;
        }
        .submit-button {
            width: 50%;
            margin: 0 auto;
            border: 1px solid #b0b0b050;
            border-radius: 3px;
            transition: color 0.25s, background-color 0.25s;
            cursor: pointer;
        }
        .submit-button:hover {
            color: white;
            background-color: red;
        }

        .comment-list {
            border-bottom: 1px solid #d3d3d3;
            margin-bottom: 10px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.05rem;
            color: #333;
        }
        .comment-list i {
            font-size: 1.2em;
        }
    </style>
</head>

<body>
    <header>
        <div class="container">
            <h1>タイトル</h1>
            <h2>サブタイトル</h2>
        </div><!-- /.container -->
    </header>
    <main>

        
        <div class="sidebar-comment">
            <h2><span>コメント&nbsp;<i class="fa-solid fa-comments" style="color: rgba(0, 0, 0, 0.6);" aria-hidden="true"></i></span></h2>
            <form class="comment-content" action="#" id="form">
                <div class="comment-box" id="commentBox">
                    <textarea class="comment-area" type="text" id="commentArea" name="comment" rows="5" maxlength="500" 
                    placeholder="コメントする..."></textarea>
                    <!-- <div class="overlay-message" id="overlayMessage"><button class="comment-login" id="googleLoginBtnComment" style="width: 50%; background: red; color: white; border-style: none;">ログインする</button></div> -->
                </div>
                <button class="submit-button" id="commentSubmit">コメントする</button>
            </form>
            
            <div class="comment-list" style="border-bottom: 1px solid #d3d3d3;">コメント一覧
                <i class="fa fa-thumbs-o-up" aria-hidden="true">いいね</i>
            </div>
            <div id="output">
                <p><span id="time"></span></p> 
            </div>
        </div>
        
    </main>
    <footer>
        
    </footer>
    <script>
        'use strict'

        // document.getElementById('form').onsubmit = function () {
        //     event.preventDefault(); //必要
        //     const search = document.getElementById('form').word.value;
        //     document.getElementById('output').textContent = `${search}の検索中…`;
        // };




        // 関数に名前をつけて再利用したいときは、こう書けます　function　handleSubmit() {}

        document.getElementById('form').onsubmit = function (event) { // 無名関数
            event.preventDefault();// フォーム送信によるページリロードを防止する
            const comment = document.getElementById('form').commentArea.value.trim();

            // 空欄は追加しない --------------------------------------------------------
            if (comment === '') return;

            // 直接画面に表示するコメント一覧の数を指定 --------------------------------
            const output = document.getElementById('output');
            if (output.childElementCount >= 4) { // 5個以上は追加しない
                output.removeChild(output.lastChild); // 一番古い(最後の)コメントを削除
            }

            // コメントをリストに追加 ------------------------------------------------
            const commentList = document.createElement('div');
            commentList.className = 'comment-block'; // クラス名のないタグ<>にクラス名を追加する

            const commentText = document.createElement('p');
            commentText.textContent = comment;
            commentList.appendChild(commentText); // 親要素(commentList)の子要素として追加

            const commentDate = document.createElement('span');
            commentDate.textContent = date.getOutputDate();
            commentDate.className = 'comment-date'; // <span class="conmment-date">
            commentList.appendChild(commentDate); // 親要素(commentList)の子要素として追加

            output.insertBefore(commentList, output.firstChild);// 新しいものを一番上に挿入（昇順表示）


            // 入力欄をクリア ---------------------------------------------------------
            document.getElementById('form').commentArea.value = '';

        };

        // 投稿日を追加
        class DateDisplay {
            getOutputDate() {
                const now = new Date();
                const year = now.getFullYear();
                const month = now.getMonth() + 1;
                const date = now.getDate();
                const hour = now.getHours();
                const min = now.getMinutes();

                return `${year}/${month}/${date} ${hour}:${min}`;
            }
        }

        const date = new DateDisplay(); // インスタンス生成
    </script>
</body>

</html>
